services:
  postgres:
    image: postgres:16-alpine
    container_name: stackfolio-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stackfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stackfolio}
      POSTGRES_DB: ${POSTGRES_DB:-stackfolio}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-stackfolio}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    profiles: ['with-redis']
    image: redis:7-alpine
    container_name: stackfolio-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # app-api and app-web are built via docker-compose.prod.yml (Fase 09)
  # Dev: run `pnpm dev` on host with DATABASE_URL pointing to postgres above

volumes:
  postgres_data:
